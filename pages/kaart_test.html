<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Kaarttest — Land Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf7; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; }
    .bar select, .bar button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #31446a; background: #111a2c; color: inherit; }
    #status { margin-left: auto; opacity: .8; }
    #map { height: calc(100vh - 60px); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="../js/map/mapview.js"></script>
</head>
<body>
  <div class="bar">
    <select id="group" aria-label="Week"></select>
    <select id="style" aria-label="Stijl"><option value="sat">Satelliet</option><option value="light">Licht</option><option value="dark">Donker</option></select>
    <button id="quiz">Quiz: klik het land</button>
    <span id="status">Laden…</span>
  </div>
  <div id="map"></div>
  <script>
    (async () => {
      const [countries, groups] = await Promise.all([
        fetch('../data/countries.json').then(r => r.json()),
        fetch('../data/groups.json').then(r => r.json())
      ]);
      const names = Object.fromEntries(countries.map(c => [c.iso, c.name_nl]));
      const status = document.getElementById('status');
      const map = new MapView(document.getElementById('map'), { geo: '../assets/maps/world.detail.json', names });
      const t0 = performance.now();
      await map.ready;
      status.textContent = `Kaart geladen in ${Math.round(performance.now() - t0)} ms`;

      const sel = document.getElementById('group');
      sel.innerHTML = groups.map(g => `<option value="${g.id}">${g.title}</option>`).join('');
      const show = () => { const g = groups.find(x => x.id === sel.value); map.setGroup(g.countries); map.fitTo(g.countries); };
      sel.onchange = show; show();
      document.getElementById('style').onchange = e => map.setStyle(e.target.value);

      let quiz = false, target = null;
      const next = () => {
        const g = groups.find(x => x.id === sel.value);
        target = g.countries[Math.floor(Math.random() * g.countries.length)];
        status.textContent = `Klik op: ${names[target]}`;
      };
      document.getElementById('quiz').onclick = () => { quiz = !quiz; quiz ? next() : (status.textContent = 'Leren'); };
      map.on('hover', iso => { if (!quiz) status.textContent = iso ? names[iso] : ''; });
      map.on('click', iso => {
        if (!quiz) return;
        const ok = iso === target;
        map.flash(iso, ok);
        if (!ok) { map.setTarget(target); setTimeout(() => { map.setTarget(null); next(); }, 1400); } else next();
      });
    })();
  </script>
</body>
</html>
